version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped  
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: . 
    container_name: library-app
    restart: unless-stopped  
    ports:
      - "${PORT}:4000"
    environment:
      DB_HOST: postgres 
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-10240}
      LOG_ERROR_FILE: ${LOG_ERROR_FILE:-logs/error.log}
      LOG_COMBINED_FILE: ${LOG_COMBINED_FILE:-logs/combined.log}
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - app-network

volumes:
  postgres-data:
  postgres-logs: