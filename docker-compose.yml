version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped  
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: . 
    container_name: library-app
    restart: unless-stopped  
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres 
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: library
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - app-network

volumes:
  postgres-data:
  postgres-logs: